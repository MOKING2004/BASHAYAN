<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0f172a">
<title>باشایان | حالت آفلاین</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #f5f5f7 0%, #e8e8ed 100%);
    color: #1d1d1f;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    line-height: 1.7;
  }

  @media (prefers-color-scheme: dark) {
    body {
      background: linear-gradient(135deg, #000 0%, #1c1c1e 100%);
      color: #f5f5f7;
    }
  }

  .offline-wrap {
    max-width: 440px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .offline-logo {
    width: 80px;
    height: 80px;
    border-radius: 22px;
    background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    line-height: 1;
    box-shadow: 0 10px 30px rgba(14, 165, 233, 0.35);
    animation: logoFloat 3s ease-in-out infinite;
  }

  .offline-icon {
    font-size: 72px;
    line-height: 1;
    margin: 4px 0;
    animation: iconPulse 2.5s ease-in-out infinite;
  }

  h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.4px;
    margin-bottom: 4px;
  }

  p {
    font-size: 14px;
    color: #86868b;
    max-width: 340px;
  }

  @media (prefers-color-scheme: dark) {
    p {
      color: #98989d;
    }
  }

  .offline-btn {
    margin-top: 8px;
    padding: 13px 30px;
    border-radius: 999px;
    background: #1d1d1f;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s, box-shadow 0.25s;
  }

  .offline-btn:active {
    transform: scale(0.94);
  }

  .offline-btn:hover {
    background: #000;
    box-shadow: 0 12px 26px rgba(0, 0, 0, 0.22);
  }

  @media (prefers-color-scheme: dark) {
    .offline-btn {
      background: #0a84ff;
    }
    .offline-btn:hover {
      background: #409cff;
    }
  }

  .offline-hint {
    font-size: 12px;
    color: #a1a1a6;
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
    justify-content: center;
  }

  .offline-hint::before {
    content: '💡';
    font-size: 14px;
  }

  .offline-footer {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid rgba(0, 0, 0, 0.08);
    width: 100%;
    font-size: 11.5px;
    color: #86868b;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  @media (prefers-color-scheme: dark) {
    .offline-footer {
      border-top-color: rgba(255, 255, 255, 0.1);
      color: #98989d;
    }
  }

  .offline-footer strong {
    color: #1d1d1f;
    font-weight: 700;
  }

  @media (prefers-color-scheme: dark) {
    .offline-footer strong {
      color: #f5f5f7;
    }
  }

  .offline-footer a {
    color: #0071e3;
    text-decoration: none;
    font-weight: 600;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes logoFloat {
    0%, 100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-6px);
    }
  }

  @keyframes iconPulse {
    0%, 100% {
      transform: scale(1);
      opacity: 1;
    }
    50% {
      transform: scale(1.08);
      opacity: 0.85;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="offline-wrap">

  <div class="offline-logo" aria-hidden="true">🛍️</div>

  <div class="offline-icon" aria-hidden="true">📡</div>

  <h1>اتصال اینترنت قطع است</h1>
  <p>برای مشاهده لیست قیمت‌ها و محصولات، لطفاً اتصال اینترنت خود را بررسی کنید.</p>

  <button type="button" class="offline-btn" onclick="location.reload()">
    <span aria-hidden="true">🔄</span>
    تلاش مجدد
  </button>

  <div class="offline-hint">اگر قبلاً اپ را باز کرده‌اید، ممکن است نسخه آفلاین در دسترس باشد.</div>

  <div class="offline-footer">
    <div><strong>فروشگاه لوازم خانگی باشایان</strong></div>
    <div><a href="https://bashayan.ir" target="_blank" rel="noopener">bashayan.ir</a></div>
    <div>طراحی از محمدمهدی کوشکی</div>
  </div>

</div>

</body>
</html>

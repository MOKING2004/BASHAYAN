<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<meta name="description" content="کاتالوگ قیمت فروشگاه لوازم خانگی لایف">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="لایف">
<title>لایف | کاتالوگ قیمت</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%23000'/%3E%3Ctext x='50' y='70' font-size='58' font-weight='700' text-anchor='middle' fill='%23ff2d2d' font-family='system-ui,sans-serif'%3EL%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <header class="topbar" id="topbar">
    <div class="bar">
      <div class="brand">
        <span class="brand-mark">L</span>
        <div class="brand-text">
          <strong>لایف</strong>
          <small>کاتالوگ قیمت</small>
        </div>
      </div>
      <div class="bar-actions">
        <button class="icon-btn" id="searchBtn" type="button" aria-label="جستجو" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="تغییر تم">
          <svg class="ico-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </button>
      </div>
    </div>

    <div class="search" id="search">
      <svg class="search-ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false" placeholder="جستجوی کالا، مدل یا رنگ…" aria-label="جستجو">
      <button class="clear" id="clearQ" type="button" aria-label="پاک کردن جستجو">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <nav class="chips" id="chips" aria-label="زیردسته‌ها"></nav>
  </header>

  <main class="main">
    <section class="hero" id="hero" aria-label="دسته‌بندی‌ها"></section>

    <section class="toolbar">
      <div class="result-info"><span id="count">۰</span> کالا</div>
      <div class="sort" id="sort" role="tablist" aria-label="مرتب‌سازی">
        <button type="button" data-sort="default" class="active" role="tab">پیش‌فرض</button>
        <button type="button" data-sort="asc"     role="tab">ارزان‌ترین</button>
        <button type="button" data-sort="desc"    role="tab">گران‌ترین</button>
      </div>
    </section>

    <section class="grid" id="grid" aria-live="polite"></section>

    <div class="empty" id="empty" hidden>
      <div class="empty-ico">
        <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      </div>
      <p>کالایی پیدا نشد</p>
      <button type="button" class="reset-btn" id="resetBtn">نمایش همه</button>
    </div>

    <footer class="foot">
      <p>فروشگاه لوازم خانگی لایف</p>
      <small id="verLine">نسخه —</small>
    </footer>
  </main>

  <button class="to-top" id="toTop" type="button" aria-label="بازگشت به بالا">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<noscript><p style="padding:24px;text-align:center;font-family:system-ui">برای مشاهده کاتالوگ، جاوااسکریپت را فعال کنید.</p></noscript>

<script src="data.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>لیست محصولات فروشگاه باشیان</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --muted:#64748b;
    --line:#e2e8f0; --accent:#0ea5e9;
  }
  html,body{overflow-x:hidden}
  body{
    font-family:'Vazirmatn',Tahoma,sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px;
    line-height:1.7; padding:10px;
  }
  .wrap{max-width:1280px;margin:0 auto}

  .hero{
    background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
    color:#fff;border-radius:14px;padding:18px 20px;margin-bottom:12px;
    box-shadow:0 8px 24px rgba(15,23,42,.15);
  }
  .hero h1{font-size:18px;font-weight:800;margin-bottom:3px}
  .hero p{font-size:12px;opacity:.85;margin-bottom:12px}
  .hero .search-wrap{position:relative;max-width:100%}
  .hero input{
    width:100%;padding:11px 14px;border-radius:10px;border:none;
    background:rgba(255,255,255,.12);color:#fff;font-size:13px;
    font-family:inherit;outline:none;transition:.2s;
  }
  .hero input::placeholder{color:rgba(255,255,255,.5)}
  .hero input:focus{background:rgba(255,255,255,.2);box-shadow:0 0 0 3px rgba(14,165,233,.35)}

  .tabs{
    display:flex;gap:7px;overflow-x:auto;padding:4px 2px 12px;
    scrollbar-width:thin;-webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{height:5px}
  .tabs::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
  .tab{
    flex-shrink:0;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);
    background:#fff;color:#334155;font-size:12px;font-weight:600;
    cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;
  }
  .tab:hover{border-color:#94a3b8}
  .tab.active{color:#fff!important;border-color:transparent;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .tab .cnt{
    display:inline-block;background:rgba(0,0,0,.06);
    padding:1px 7px;border-radius:20px;font-size:10px;margin-inline-start:5px;
  }
  .tab.active .cnt{background:rgba(255,255,255,.28)}

  .card{
    background:var(--card);border-radius:12px;overflow:hidden;
    box-shadow:0 3px 14px rgba(15,23,42,.06);margin-bottom:20px;
  }
  .card-head{
    padding:12px 16px;color:#fff;display:flex;justify-content:space-between;
    align-items:center;flex-wrap:wrap;gap:6px;
  }
  .card-head h2{font-size:14.5px;font-weight:800}
  .card-head .stats{font-size:11px;background:rgba(255,255,255,.22);
    padding:2px 10px;border-radius:20px;font-weight:600}

  .table-scroll{
    overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
  }
  .table-scroll::-webkit-scrollbar{height:6px}
  .table-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
  .table-scroll::-webkit-scrollbar-track{background:#f1f5f9}

  table{width:100%;min-width:760px;border-collapse:collapse;font-size:12.5px}
  thead th{
    background:#f8fafc;color:#334155;font-size:11px;font-weight:700;
    text-align:right;padding:9px 10px;border-bottom:2px solid var(--line);
    white-space:nowrap;position:sticky;top:0;z-index:2;
  }
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:hover{background:#fafbfc}
  tbody tr:last-child td{border-bottom:none}

  .p-name{font-weight:600;font-size:12.5px;line-height:1.5;min-width:180px}
  .p-feat{font-size:11px;color:#475569;line-height:1.8;min-width:220px}
  .p-feat b{color:#0f172a;font-weight:700}
  .p-price{font-weight:800;font-size:13px;white-space:nowrap;
    font-variant-numeric:tabular-nums;color:#0f172a}
  .p-price .old{
    display:block;font-size:10px;color:#94a3b8;
    text-decoration:line-through;font-weight:500;
  }
  .p-bajet{font-weight:700;color:#0f766e;font-size:12px;white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .p-avand{font-weight:700;color:#9a3412;font-size:12px;white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .p-bajet small,.p-avand small{display:block;color:#94a3b8;
    font-weight:500;font-size:9.5px;margin-top:1px}

  .badge{
    display:inline-block;font-size:9px;font-weight:700;
    padding:1px 6px;border-radius:20px;margin-inline-start:4px;
    vertical-align:middle;background:#fef3c7;color:#92400e;
  }

  .search-title{
    background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
    padding:9px 14px;border-radius:9px;margin-bottom:12px;
    font-size:12px;font-weight:600;
  }

  .footer{
    text-align:center;color:var(--muted);font-size:11px;
    padding:14px;line-height:2;
  }
  .footer a{color:var(--accent);text-decoration:none;font-weight:600}

  @media (max-width:640px){
    body{padding:6px}
    .hero{padding:14px 16px;border-radius:12px}
    .hero h1{font-size:15px}
    .hero p{font-size:10.5px}
    .hero input{font-size:12px;padding:10px 12px}
    .card-head{padding:10px 12px}
    .card-head h2{font-size:13px}
    table{min-width:680px;font-size:11.5px}
    thead th{font-size:10px;padding:7px 8px}
    tbody td{padding:7px 8px}
    .p-name{font-size:11.5px;min-width:150px}
    .p-feat{font-size:10px;min-width:180px}
    .p-price{font-size:12px}
    .p-bajet,.p-avand{font-size:11px}
  }

  @media print{
    body{background:#fff;padding:0;font-size:9.5px}
    .wrap{max-width:none}
    .hero{background:#0f172a!important;border-radius:0;padding:10px 14px;
      -webkit-print-color-adjust:exact;print-color-adjust:exact}
    .hero h1{font-size:13px}.hero p{font-size:8.5px;margin-bottom:0}
    .hero .search-wrap{display:none}
    .tabs{display:none}
    .card{box-shadow:none;border-radius:0;margin-bottom:6px;page-break-inside:avoid}
    .card-head{padding:6px 10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .card-head h2{font-size:10.5px}
    .table-scroll{overflow:visible}
    table{font-size:8px;min-width:0}
    thead th{font-size:7.5px;padding:4px 6px;position:static}
    tbody td{padding:4px 6px}
    thead{display:table-header-group}
    tr{page-break-inside:avoid}
    .badge,.p-price .old{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    @page{size:A4 landscape;margin:6mm}
  }
</style>

function fa(n){ return Number(n).toLocaleString('fa-IR'); }
function bajet(base){ return Math.round((base * 1.14) / 24); }
function avand(base){ return Math.round((base * 1.10) / 18); }

function shade(hex, p){
  var n = parseInt(hex.slice(1),16);
  var r=(n>>16)+p, g=((n>>8)&0xff)+p, b=(n&0xff)+p;
  r=Math.max(0,Math.min(255,r));
  g=Math.max(0,Math.min(255,g));
  b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

var activeTab = 'all';
var searchTerm = '';

function renderTabs(){
  var tabsEl = document.getElementById('tabs');
  var totalItems = 0;
  CATEGORIES.forEach(function(c){ totalItems += c.items.length; });

  var list = [{id:'all', name:'همه', color:'#0f172a'}].concat(CATEGORIES);
  var html = '';
  list.forEach(function(cat){
    var cnt = cat.id === 'all' ? totalItems : cat.items.length;
    var isActive = activeTab === cat.id;
    var inlineStyle = isActive ? 'background:'+cat.color+';border-color:'+cat.color+';color:#fff;' : '';
    html += '<button type="button" class="tab'+(isActive?' active':'')+'" data-id="'+cat.id+'" style="'+inlineStyle+'">'
          + cat.name + '<span class="cnt">'+fa(cnt)+'</span></button>';
  });
  tabsEl.innerHTML = html;

  var btns = tabsEl.querySelectorAll('.tab');
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener('click', function(){
      activeTab = this.getAttribute('data-id');
      renderTabs();
      renderContent();
    });
  }
}

function itemRow(item){
  var base = (typeof item.b === 'number') ? item.b : item.p;
  var hasDiff = (typeof item.b === 'number');

  var priceHtml;
  if(hasDiff){
    priceHtml = '<span class="old">'+fa(item.b)+'</span>'+fa(item.p);
  } else {
    priceHtml = fa(item.p);
  }

  var badge = item.badge ? '<span class="badge">نقدی ویژه</span>' : '';
  var noteBajet = hasDiff ? '<small>بر اساس قیمت لیست ('+fa(base)+')</small>' : '<small>تومان</small>';
  var noteAvand = noteBajet;

  return '<tr>'
    + '<td><div class="p-name">'+item.n+badge+'</div></td>'
    + '<td><div class="p-feat">'+item.k+'</div></td>'
    + '<td class="p-price">'+priceHtml+'</td>'
    + '<td class="p-bajet">'+fa(bajet(base))+noteBajet+'</td>'
    + '<td class="p-avand">'+fa(avand(base))+noteAvand+'</td>'
    + '</tr>';
}

function tableHtml(items){
  var rows = '';
  for(var i=0;i<items.length;i++){ rows += itemRow(items[i]); }
  return '<div class="table-scroll"><table>'
    + '<thead><tr>'
    + '<th style="width:28%">محصول</th>'
    + '<th style="width:29%">توضیحات کلیدی</th>'
    + '<th style="width:15%">قیمت (تومان)</th>'
    + '<th style="width:14%">قسط ۲۴ ماهه<br><small style="font-weight:500;opacity:.7">باجت</small></th>'
    + '<th style="width:14%">قسط ۱۸ ماهه<br><small style="font-weight:500;opacity:.7">آوند</small></th>'
    + '</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function categoryCard(cat, itemsOverride){
  var items = itemsOverride || cat.items;
  var headStyle = 'background:linear-gradient(90deg,'+cat.color+','+shade(cat.color,-20)+')';
  return '<section class="card">'
    + '<div class="card-head" style="'+headStyle+'">'
    + '<h2>'+cat.name+'</h2>'
    + '<span class="stats">'+fa(items.length)+' کالا</span>'
    + '</div>'
    + tableHtml(items)
    + '</section>';
}

function renderContent(){
  var content = document.getElementById('content');
  var q = searchTerm.trim().toLowerCase();

  if(q){
    var grouped = {};
    var order = [];
    var totalMatches = 0;

    CATEGORIES.forEach(function(cat){
      cat.items.forEach(function(it){
        var plain = (it.n + ' ' + it.k).replace(/<[^>]+>/g,'');
        if(plain.toLowerCase().indexOf(q) !== -1){
          if(!grouped[cat.id]){
            grouped[cat.id] = {cat:cat, items:[]};
            order.push(cat.id);
          }
          grouped[cat.id].items.push(it);
          totalMatches++;
        }
      });
    });

    if(totalMatches === 0){
      content.innerHTML = '<div class="search-title">نتیجه‌ای برای «'+searchTerm+'» پیدا نشد.</div>';
      return;
    }

    var html = '<div class="search-title">'+fa(totalMatches)+' نتیجه برای «'+searchTerm+'»</div>';
    order.forEach(function(id){
      html += categoryCard(grouped[id].cat, grouped[id].items);
    });
    content.innerHTML = html;
    return;
  }

  if(activeTab === 'all'){
    var out = '';
    CATEGORIES.forEach(function(cat){ out += categoryCard(cat); });
    content.innerHTML = out;
  } else {
    for(var i=0;i<CATEGORIES.length;i++){
      if(CATEGORIES[i].id === activeTab){
        content.innerHTML = categoryCard(CATEGORIES[i]);
        break;
      }
    }
  }
}

document.getElementById('searchInput').addEventListener('input', function(e){
  searchTerm = e.target.value;
  renderContent();
});

renderTabs();
renderContent();
</script>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- گرادیان اصلی برند -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- گرادیان براق بالای پس‌زمینه -->
    <linearGradient id="bgShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- سایه کیف -->
    <radialGradient id="bagShadow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- گرادیان کیف (سفید تا کرم) -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f4fd"/>
    </linearGradient>

    <!-- گرادیان دسته -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- فیلتر سایه نرم -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- پس‌زمینه مربع گرد با گرادیان -->
  <rect x="0" y="0" width="192" height="192" rx="44" ry="44" fill="url(#bgGrad)"/>

  <!-- براقیت بالای پس‌زمینه -->
  <rect x="0" y="0" width="192" height="96" rx="44" ry="44" fill="url(#bgShine)"/>

  <!-- سایه زیر کیف -->
  <ellipse cx="96" cy="156" rx="52" ry="10" fill="url(#bagShadow)"/>

  <!-- بدنه کیف خرید -->
  <g filter="url(#softShadow)">
    <!-- بدنه اصلی کیف -->
    <path d="
      M 54 68
      L 138 68
      Q 146 68 147 76
      L 155 148
      Q 156 158 146 158
      L 46 158
      Q 36 158 37 148
      L 45 76
      Q 46 68 54 68
      Z
    " fill="url(#bagGrad)"/>

    <!-- دسته کیف (قوس بالایی) -->
    <path d="
      M 72 68
      Q 72 38 96 38
      Q 120 38 120 68
    " fill="none" stroke="url(#handleGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- خط تزئینی افقی روی کیف -->
    <line x1="50" y1="92" x2="142" y2="92"
          stroke="#0ea5e9" stroke-opacity="0.35"
          stroke-width="2" stroke-linecap="round"/>

    <!-- دو خط کوتاه تزئینی -->
    <line x1="72" y1="112" x2="120" y2="112"
          stroke="#0ea5e9" stroke-opacity="0.22"
          stroke-width="2" stroke-linecap="round"/>
    <line x1="72" y1="128" x2="104" y2="128"
          stroke="#0ea5e9" stroke-opacity="0.22"
          stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- براقیت کوچک روی کیف -->
  <path d="
    M 60 78
    Q 62 74 68 74
    L 68 90
    Q 60 90 60 84
    Z
  " fill="#ffffff" fill-opacity="0.6"/>
</svg>
